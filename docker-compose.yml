services:
  db:
    image: postgres:16-alpine
    container_name: emg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-starterkit}
      TZ: Asia/Jakarta
    volumes:
      - emg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-starterkit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emg-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      GIN_MODE: release
      SERVER_PORT: 8080
      FRONTEND_DIST: /app/dist
      DATABASE_DSN: "host=db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-starterkit} port=5432 sslmode=disable TimeZone=Asia/Jakarta"
      JWT_SECRET: ${JWT_SECRET:-estetika-mata-group-production-secret-key-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  emg_pgdata:
