services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: emg-postgres-dev
    environment:
      POSTGRES_USER: emg123
      POSTGRES_PASSWORD: emg_123
      POSTGRES_DB: emg_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - emg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emg123 -d emg_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emg-network

volumes:
  emg_postgres_data:

networks:
  emg-network:
    driver: bridge
